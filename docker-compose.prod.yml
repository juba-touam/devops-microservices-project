services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - microservices

  catalogue:
    image: jubatouam/catalogue:${IMAGE_TAG}
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=${MONGO_URI}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - microservices

  payment:
    image: jubatouam/payment:${IMAGE_TAG}
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - notification
    environment:
      - MONGO_URI=${MONGO_URI}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - NOTIFICATION_URL=${NOTIFICATION_URL}
    networks:
      - microservices

  notification:
    image: jubatouam/notification:${IMAGE_TAG}
    ports:
      - "3001:3001"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=${MONGO_URI}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - NODE_ENV=${NODE_ENV}
    networks:
      - microservices

  frontend:
    image: jubatouam/frontend:${IMAGE_TAG}
    ports:
      - "4200:80"
    depends_on:
      - catalogue
      - payment
      - notification
    networks:
      - microservices

networks:
  microservices:
    driver: bridge

volumes:
  mongo-data:
