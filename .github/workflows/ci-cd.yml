name: CI Pipeline

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

jobs:
  test-unitaire:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Catalogue — Run unit tests with JaCoCo coverage
        run: mvn test -f services/catalogue/pom.xml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Payment — Run unit tests with pytest-cov
        run: |
          pip install -r services/payment/requirements.txt
          python -m pytest services/payment/tests/test_main.py --cov=services/payment/app --cov-report=xml:services/payment/coverage.xml -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Notification — Run unit tests with Jest coverage
        run: |
          cd services/notification
          npm ci
          npx jest app.test.js --coverage --coverageReporters=lcov --forceExit --detectOpenHandles
          sed -i 's|SF:src/|SF:services/notification/src/|g' coverage/lcov.info

      - name: Frontend — Run unit tests with Jest coverage
        run: |
          cd services/frontend
          npm ci
          npx jest --coverage --coverageReporters=lcov
          sed -i 's|SF:src/|SF:services/frontend/src/|g' coverage/lcov.info

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            services/catalogue/target/site/jacoco/jacoco.xml
            services/payment/coverage.xml
            services/notification/coverage/lcov.info
            services/frontend/coverage/lcov.info

  test-integration:
    name: Tests d'Intégration
    runs-on: ubuntu-latest
    needs: test-unitaire
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Payment — Run integration tests
        run: |
          pip install -r services/payment/requirements.txt
          python -m pytest services/payment/tests/test_integration.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Notification — Run integration tests
        run: |
          cd services/notification
          npm ci
          npx jest app.integration.test.js --forceExit --detectOpenHandles

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test-unitaire
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: services

      - name: Compile Java classes for SonarCloud
        run: mvn compile -f services/catalogue/pom.xml -q

      - name: Verify coverage reports
        run: |
          echo "=== Downloaded artifact contents ==="
          find services -name "jacoco.xml" -o -name "coverage.xml" -o -name "lcov.info" 2>/dev/null
          echo "=== Coverage files ==="
          ls -la services/catalogue/target/site/jacoco/jacoco.xml && echo "JaCoCo OK" || echo "JaCoCo MISSING"
          ls -la services/payment/coverage.xml && echo "Python OK" || echo "Python MISSING"
          ls -la services/notification/coverage/lcov.info && echo "Notification OK" || echo "Notification MISSING"
          ls -la services/frontend/coverage/lcov.info && echo "Frontend OK" || echo "Frontend MISSING"
          echo "=== Java classes ==="
          ls services/catalogue/target/classes/com/example/catalogue/ || echo "Classes MISSING"
          echo "=== Notification lcov.info paths ==="
          head -5 services/notification/coverage/lcov.info || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "SonarCloud Quality Gate — ${{ job.status }} — ${{ github.repository }}"
          body: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Quality Gate Status: ${{ job.status }}

            See details: https://sonarcloud.io/project/overview?id=juba-touam_devops-microservices-project
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.GMAIL_USERNAME }}

  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Catalogue
        uses: docker/build-push-action@v5
        with:
          context: ./services/catalogue
          push: true
          tags: jubatouam/catalogue:${{ github.sha }}
          cache-from: type=gha,scope=catalogue
          cache-to: type=gha,mode=max,scope=catalogue

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          push: true
          tags: jubatouam/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & Push Payment
        uses: docker/build-push-action@v5
        with:
          context: ./services/payment
          push: true
          tags: jubatouam/payment:${{ github.sha }}
          cache-from: type=gha,scope=payment
          cache-to: type=gha,mode=max,scope=payment

      - name: Build & Push Notification
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification
          push: true
          tags: jubatouam/notification:${{ github.sha }}
          cache-from: type=gha,scope=notification
          cache-to: type=gha,mode=max,scope=notification

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    steps:
      - name: Scan Catalogue Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: jubatouam/catalogue:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: jubatouam/frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Scan Payment Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: jubatouam/payment:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Scan Notification Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: jubatouam/notification:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  resolve-secrets:
    name: Resolve AWS Secrets
    runs-on: ubuntu-latest
    needs: trivy-scan
    permissions:
      id-token: write
      contents: read
    outputs:
      ec2_host: ${{ steps.secrets.outputs.ec2_host }}
      ec2_user: ${{ steps.secrets.outputs.ec2_user }}
      ec2_ssh_key: ${{ steps.secrets.outputs.ec2_ssh_key }}
    env:
      ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/staging' && 'staging' || 'dev' }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::699475947506:role/github-actions-${{ env.ENV_NAME }}
          aws-region: eu-west-3

      - name: Fetch secrets from AWS Secrets Manager
        id: secrets
        run: |
          get_secret() {
            aws secretsmanager get-secret-value --secret-id "microservices/${{ env.ENV_NAME }}/$1" --query SecretString --output text
          }
          echo "ec2_host=$(get_secret ec2_host)" >> $GITHUB_OUTPUT
          echo "ec2_user=$(get_secret ec2_user)" >> $GITHUB_OUTPUT
          EC2_SSH_KEY=$(get_secret ec2_ssh_key)
          echo "ec2_ssh_key<<EOF" >> $GITHUB_OUTPUT
          echo "$EC2_SSH_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: resolve-secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.resolve-secrets.outputs.ec2_host }}
          username: ${{ needs.resolve-secrets.outputs.ec2_user }}
          key: ${{ needs.resolve-secrets.outputs.ec2_ssh_key }}
          source: docker-compose.prod.yml
          target: ~/app

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.resolve-secrets.outputs.ec2_host }}
          username: ${{ needs.resolve-secrets.outputs.ec2_user }}
          key: ${{ needs.resolve-secrets.outputs.ec2_ssh_key }}
          script: |
            cd ~/app
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
