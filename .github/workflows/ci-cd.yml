name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Catalogue
        uses: docker/build-push-action@v5
        with:
          context: ./services/catalogue
          push: true
          tags: jubatouam/catalogue:${{ github.sha }}
          cache-from: type=gha,scope=catalogue
          cache-to: type=gha,mode=max,scope=catalogue

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          push: true
          tags: jubatouam/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & Push Payment
        uses: docker/build-push-action@v5
        with:
          context: ./services/payment
          push: true
          tags: jubatouam/payment:${{ github.sha }}
          cache-from: type=gha,scope=payment
          cache-to: type=gha,mode=max,scope=payment

      - name: Build & Push Notification
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification
          push: true
          tags: jubatouam/notification:${{ github.sha }}
          cache-from: type=gha,scope=notification
          cache-to: type=gha,mode=max,scope=notification

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Create app directory
            mkdir -p ~/app && cd ~/app

            # Create docker-compose.yml for production
            cat > docker-compose.yml <<'COMPOSE'
            services:
              mongo:
                image: mongo:7
                ports:
                  - "27017:27017"
                volumes:
                  - mongo-data:/data/db
                networks:
                  - microservices

              catalogue:
                image: jubatouam/catalogue:${{ github.sha }}
                ports:
                  - "8080:8080"
                depends_on:
                  - mongo
                networks:
                  - microservices

              payment:
                image: jubatouam/payment:${{ github.sha }}
                ports:
                  - "8000:8000"
                depends_on:
                  - mongo
                  - notification
                networks:
                  - microservices

              notification:
                image: jubatouam/notification:${{ github.sha }}
                ports:
                  - "3001:3001"
                depends_on:
                  - mongo
                networks:
                  - microservices

              frontend:
                image: jubatouam/frontend:${{ github.sha }}
                ports:
                  - "4200:80"
                depends_on:
                  - catalogue
                  - payment
                  - notification
                networks:
                  - microservices

            networks:
              microservices:
                driver: bridge

            volumes:
              mongo-data:
            COMPOSE

            # Pull and restart
            docker compose pull
            docker compose up -d