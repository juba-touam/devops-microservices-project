name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Test with coverage (all 4 services) ---

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Catalogue — Run tests with JaCoCo coverage
        run: mvn test -f services/catalogue/pom.xml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Payment — Run tests with pytest-cov
        working-directory: services/payment
        run: |
          pip install -r requirements.txt
          python -m pytest tests --cov=app --cov-report=xml:coverage.xml -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Notification — Run tests with Jest coverage
        run: |
          cd services/notification
          npm ci
          npx jest --coverage --coverageReporters=lcov --forceExit --detectOpenHandles

      - name: Frontend — Run tests with Jest coverage
        run: |
          cd services/frontend
          npm ci
          npx jest --coverage

      # --- SonarCloud Scan ---

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # --- Quality Gate ---

      - name: SonarCloud Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --- Email Notification ---

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "SonarCloud Quality Gate — ${{ job.status }} — ${{ github.repository }}"
          body: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Quality Gate Status: ${{ job.status }}

            See details: https://sonarcloud.io/project/overview?id=juba-touam_devops-microservices-project
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.GMAIL_USERNAME }}

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Catalogue
        uses: docker/build-push-action@v5
        with:
          context: ./services/catalogue
          push: true
          tags: jubatouam/catalogue:${{ github.sha }}
          cache-from: type=gha,scope=catalogue
          cache-to: type=gha,mode=max,scope=catalogue

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          push: true
          tags: jubatouam/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & Push Payment
        uses: docker/build-push-action@v5
        with:
          context: ./services/payment
          push: true
          tags: jubatouam/payment:${{ github.sha }}
          cache-from: type=gha,scope=payment
          cache-to: type=gha,mode=max,scope=payment

      - name: Build & Push Notification
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification
          push: true
          tags: jubatouam/notification:${{ github.sha }}
          cache-from: type=gha,scope=notification
          cache-to: type=gha,mode=max,scope=notification

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/app

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d